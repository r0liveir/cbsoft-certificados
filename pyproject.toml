[project]
name = "cbsoft-certificates"
version = "0.1.0"
description = "Batch certificate generator from XLSX or Google Sheets data"
requires-python = ">=3.10"
dependencies = [
  "openpyxl>=3.1,<4",
  "python-pptx>=1.0,<2",
]

[project.scripts]
certgen = "certgen.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["certgen*"]
